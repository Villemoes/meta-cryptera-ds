openssl_conf = openssl_init

[openssl_init]
providers = provider_section
engines = engine_section

[provider_section]
pkcs11 = pkcs11_provider_section
default = default_provider_section

[default_provider_section]
activate = 1

[pkcs11_provider_section]
module = @@PKCS11_PROVIDER_PATH@@
pkcs11_module = @@CRYPTERA_PKCS11_MODULE_PATH@@
debug_level = 7
activate = 1

[engine_section]
pkcs11 = pkcs11_engine_section

[pkcs11_engine_section]
engine_id = pkcs11
dynamic_path = @@PKCS11_ENGINE_PATH@@
MODULE_PATH = @@CRYPTERA_PKCS11_MODULE_PATH@@
